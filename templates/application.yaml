{{- range .Values.apps}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{.name}}
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{.source.repoURL}}
    targetRevision: {{.source.targetRevision}}
    path: {{.source.path}}
  destination:
    server: {{.destination.server | default .Values.defaults.destination.server}}
    namespace: {{.destination.namespace | default .Values.defaults.destination.namespace}}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end}}
